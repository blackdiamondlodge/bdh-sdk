name: Hub app CI

# Reusable workflow for hub app repos. Builds the app as a wheel, installs it
# next to a checkout of the hub and checks that the hub picks it up.
#
#   jobs:
#     hub:
#       uses: blackdiamondlodge/bdh-sdk/.github/workflows/app-ci.yml@v0
#       with:
#         app_id: wifi

on:
  workflow_call:
    inputs:
      app_id:
        description: Plugin id (and, by default, the app's Python package).
        required: true
        type: string
      hub_ref:
        description: Branch, tag or SHA of blackdiamondlodge/BlackDiamondHub to test against.
        required: false
        type: string
        default: main
      python-version:
        required: false
        type: string
        default: "3.12"
      test_module:
        description: Module passed to `manage.py test`. Defaults to app_id.
        required: false
        type: string
        default: ""
      sdk_ref:
        description: Git ref of blackdiamondlodge/bdh-sdk to install.
        required: false
        type: string
        default: v0
      selenium:
        description: Also run the app's tests tagged "selenium" in headless Chrome.
        required: false
        type: boolean
        default: true
      go2rtc:
        description: Start a go2rtc server on localhost:1984 for the selenium tests.
        required: false
        type: boolean
        default: false
    secrets:
      hub_token:
        description: Token to read BlackDiamondHub if it is private. Defaults to GITHUB_TOKEN.
        required: false

permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-22.04
    env:
      APP_ID: ${{ inputs.app_id }}
      TEST_MODULE: ${{ inputs.test_module || inputs.app_id }}
      DJANGO_SETTINGS_MODULE: BlackDiamondHub.settings_test
      DJANGO_SECRET_KEY: ci
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          repository: blackdiamondlodge/BlackDiamondHub
          ref: ${{ inputs.hub_ref }}
          path: hub
          token: ${{ secrets.hub_token || github.token }}

      # While an app is being extracted the hub still ships its own copy.
      # Drop it so the tests run against the installed wheel and the plugin
      # id isn't registered twice.
      - name: Remove any in-tree copy of the app from the hub
        working-directory: hub
        run: |
          rm -rf "$APP_ID"
          sed -i "/['\"]${APP_ID}\.plugin\.spec['\"]/d" BlackDiamondHub/settings.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libpq-dev

      - name: Install hub requirements and bdh-sdk
        run: |
          python -m pip install --upgrade pip build
          pip install -r hub/requirements.txt
          pip install "bdh-sdk @ git+https://github.com/blackdiamondlodge/bdh-sdk@${{ inputs.sdk_ref }}"

      - name: Build and install the app wheel
        run: |
          python -m build --wheel -o dist app
          pip install dist/*.whl

      - name: Plugin module imports cleanly
        working-directory: ${{ runner.temp }}
        run: python -c "from bdh_sdk.testing import assert_plugin_importable; assert_plugin_importable('${APP_ID}.plugin')"

      - name: Django checks
        working-directory: hub
        run: |
          python manage.py check
          python manage.py collectstatic --noinput

      - name: Hub smoke test
        working-directory: hub
        run: python manage.py hub_smoke --app "$APP_ID"

      - name: App tests
        working-directory: hub
        run: python manage.py test "$TEST_MODULE" --settings=BlackDiamondHub.settings_test --exclude-tag=selenium -v 2

  selenium:
    if: ${{ inputs.selenium }}
    runs-on: ubuntu-22.04
    env:
      APP_ID: ${{ inputs.app_id }}
      TEST_MODULE: ${{ inputs.test_module || inputs.app_id }}
      DJANGO_SETTINGS_MODULE: BlackDiamondHub.settings_test
      DJANGO_SECRET_KEY: ci
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          repository: blackdiamondlodge/BlackDiamondHub
          ref: ${{ inputs.hub_ref }}
          path: hub
          token: ${{ secrets.hub_token || github.token }}

      # While an app is being extracted the hub still ships its own copy.
      # Drop it so the tests run against the installed wheel and the plugin
      # id isn't registered twice.
      - name: Remove any in-tree copy of the app from the hub
        working-directory: hub
        run: |
          rm -rf "$APP_ID"
          sed -i "/['\"]${APP_ID}\.plugin\.spec['\"]/d" BlackDiamondHub/settings.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libpq-dev

      # The runner image ships Google Chrome; Selenium Manager fetches the
      # matching chromedriver.
      - name: Install hub requirements, bdh-sdk and the app
        run: |
          python -m pip install --upgrade pip build
          pip install -r hub/requirements.txt
          pip install "bdh-sdk @ git+https://github.com/blackdiamondlodge/bdh-sdk@${{ inputs.sdk_ref }}"
          python -m build --wheel -o dist app
          pip install dist/*.whl

      - name: Start go2rtc
        if: ${{ inputs.go2rtc }}
        run: |
          mkdir -p /tmp/go2rtc
          printf 'api:\n  listen: ":1984"\n  origin: "*"\nwebrtc:\n  listen: ":8555"\n' > /tmp/go2rtc/go2rtc.yaml
          docker run -d --name go2rtc -p 1984:1984 -p 8555:8555 -v /tmp/go2rtc:/config alexxit/go2rtc
          for i in $(seq 1 30); do
            curl -sf http://localhost:1984/api/streams > /dev/null && { echo "go2rtc is ready"; exit 0; }
            sleep 1
          done
          echo "go2rtc did not start"; exit 1

      - name: Selenium tests
        working-directory: hub
        run: python manage.py test "$TEST_MODULE" --settings=BlackDiamondHub.settings_test --tag=selenium -v 2
