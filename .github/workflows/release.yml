name: Release

# Tags and publishes a GitHub release for the version in pyproject.toml the
# first time that version lands on main. Bump the version in a PR to release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -v

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Tag and create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          sha=$(sha256sum "$wheel" | cut -d' ' -f1)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "bdh-sdk $VERSION"
          git push origin "refs/tags/$TAG"

          # Moving major tag (e.g. v0) so app repos can pin
          # blackdiamondlodge/bdh-sdk/.github/workflows/app-ci.yml@v0.
          git tag -fa "$MAJOR" -m "bdh-sdk $VERSION" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"

          {
            echo "bdh-sdk $VERSION"
            echo
            echo "Install:"
            echo
            echo '```'
            echo "pip install \"bdh-sdk @ git+https://github.com/${GITHUB_REPOSITORY}@${TAG}\""
            echo '```'
            echo
            echo "Wheel \`$(basename "$wheel")\` sha256:"
            echo
            echo '```'
            echo "$sha"
            echo '```'
          } > release-notes.md

          gh release create "$TAG" "$wheel" "$sdist" \
            --title "bdh-sdk $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
