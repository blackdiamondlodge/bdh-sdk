name: Hub app release

# Reusable release workflow for hub app repos. The first time a version in
# pyproject.toml lands on main it tags v<version>, builds the wheel and
# publishes a GitHub release whose notes include the ready-to-paste line for
# the hub's sites/<site>/apps.txt.
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: blackdiamondlodge/bdh-sdk/.github/workflows/app-release.yml@v0
#       permissions:
#         contents: write

on:
  workflow_call:
    outputs:
      released:
        description: "true when a new release was published"
        value: ${{ jobs.release.outputs.released }}
      tag:
        value: ${{ jobs.release.outputs.tag }}
      requirement:
        description: The apps.txt line (URL + hash) for the new wheel.
        value: ${{ jobs.release.outputs.requirement }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.publish.outputs.released || 'false' }}
      tag: ${{ steps.version.outputs.tag }}
      requirement: ${{ steps.publish.outputs.requirement }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          read -r name version < <(python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; print(p['name'], p['version'])")
          tag="v${version}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Tag and create release
        id: publish
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          sha=$(sha256sum "$wheel" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$wheel")"
          requirement="${NAME} @ ${url} --hash=sha256:${sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "${NAME} ${VERSION}"
          git push origin "refs/tags/$TAG"

          {
            echo "${NAME} ${VERSION}"
            echo
            echo "Line for the hub's \`sites/<site>/apps.txt\`:"
            echo
            echo '```'
            echo "$requirement"
            echo '```'
          } > release-notes.md

          gh release create "$TAG" "$wheel" "$sdist" \
            --title "${NAME} ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "requirement=${requirement}" >> "$GITHUB_OUTPUT"
